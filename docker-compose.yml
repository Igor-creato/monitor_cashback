x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:18.4-alpine
    logging: *json-logging
    mem_limit: 1g
    memswap_limit: 1g
    env_file:
      - ${PRICE_MONITOR_ENV_FILE:-.env.example}
    ports:
      - "${PRICE_MONITOR_BIND_ADDRESS:-127.0.0.1}:5432:5432"
    volumes:
      - postgres-data-pg18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U price_monitor -d price_monitor"]
      interval: 60s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.3.2-management-alpine
    logging: *json-logging
    mem_limit: 768m
    memswap_limit: 768m
    env_file:
      - ${PRICE_MONITOR_ENV_FILE:-.env.example}
    ports:
      - "${PRICE_MONITOR_BIND_ADDRESS:-127.0.0.1}:5672:5672"
      - "${PRICE_MONITOR_BIND_ADDRESS:-127.0.0.1}:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./deploy/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-monitor.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 60s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.8.0-alpine
    logging: *json-logging
    mem_limit: 256m
    memswap_limit: 256m
    ports:
      - "${PRICE_MONITOR_BIND_ADDRESS:-127.0.0.1}:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 60s
      timeout: 5s
      retries: 5

  browserless:
    image: ghcr.io/browserless/chromium:2.26.1
    logging: *json-logging
    mem_limit: 2g
    memswap_limit: 2g
    environment:
      TOKEN: ${PRICE_MONITOR_BROWSERLESS_TOKEN:-price-monitor-renderer}
      HOST: 0.0.0.0
      CONCURRENT: 1
      QUEUED: 2
      TIMEOUT: 45000
      CORS: "false"
      ALLOW_FILE_PROTOCOL: "false"
      HEALTH: "true"
      MAX_CPU_PERCENT: 95
      MAX_MEMORY_PERCENT: 95
    shm_size: "2g"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/pressure"]
      interval: 60s
      timeout: 10s
      retries: 5

  api:
    build: .
    logging: *json-logging
    mem_limit: 512m
    memswap_limit: 512m
    env_file:
      - ${PRICE_MONITOR_ENV_FILE:-.env.example}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${PRICE_MONITOR_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3).read()",
        ]
      interval: 60s
      timeout: 5s
      retries: 3

  worker:
    build: .
    logging: *json-logging
    mem_limit: 1536m
    memswap_limit: 1536m
    env_file:
      - ${PRICE_MONITOR_ENV_FILE:-.env.example}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      browserless:
        condition: service_healthy
    command:
      [
        "celery",
        "-A",
        "price_monitor.workers.tasks.fetch_product.celery_app",
        "worker",
        "--loglevel=INFO",
        "--without-gossip",
        "--without-mingle",
        "--without-heartbeat",
        "-Q",
        "price-monitor.fetch,price-monitor.outbox",
      ]
    healthcheck:
      disable: true

volumes:
  postgres-data:
  postgres-data-pg18:
  rabbitmq-data:
  redis-data:
