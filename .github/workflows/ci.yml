name: CI

on:
  push:
    branches: [develop, master, "feature/**", "fix/**"]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.14.6"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest

      - name: Ruff
        run: python -m ruff check .

      - name: Ruff format
        run: python -m ruff format --check .

      - name: Mypy
        run: python -m mypy

      - name: Whitespace
        run: git diff --check

      - name: Docker compose config
        run: docker compose config --quiet

      - name: Docker build
        run: docker build -t price-monitor:${{ github.sha }} .

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,config,secret
          severity: CRITICAL,HIGH
          exit-code: "1"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  deploy-test:
    runs-on: ubuntu-latest
    needs: [quality, secret-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment: test
    concurrency:
      group: deploy-test
      cancel-in-progress: false
    env:
      BASE_DIR: /home/igor/monitor_cashback
      RELEASE_SHA: ${{ github.sha }}
      TEST_SERVER_HOST: ${{ vars.TEST_SERVER_HOST }}
      TEST_SERVER_USER: ${{ vars.TEST_SERVER_USER }}
      TEST_SERVER_PORT: ${{ vars.TEST_SERVER_PORT || '22' }}
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Configure SSH
        env:
          TEST_SERVER_SSH_KEY: ${{ secrets.TEST_SERVER_SSH_KEY }}
          TEST_SERVER_KNOWN_HOSTS: ${{ secrets.TEST_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$TEST_SERVER_HOST"
          test -n "$TEST_SERVER_USER"
          test -n "$TEST_SERVER_PORT"
          test -n "$TEST_SERVER_SSH_KEY"
          test -n "$TEST_SERVER_KNOWN_HOSTS"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$TEST_SERVER_SSH_KEY" > "$HOME/.ssh/test_server_key"
          chmod 600 "$HOME/.ssh/test_server_key"
          printf '%s\n' "$TEST_SERVER_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Package release
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/release.tar.gz"
          tar \
            --exclude='.git' \
            --exclude='.mypy_cache' \
            --exclude='.pytest_cache' \
            --exclude='.ruff_cache' \
            --exclude='.venv' \
            -czf "$RUNNER_TEMP/release.tar.gz" .

      - name: Upload release
        run: |
          set -euo pipefail
          SSH_OPTS=(-i "$HOME/.ssh/test_server_key" -p "$TEST_SERVER_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          REMOTE="$TEST_SERVER_USER@$TEST_SERVER_HOST"
          CREATE_RELEASE_COMMAND='mkdir -p "$BASE_DIR/releases/$RELEASE_SHA" "$BASE_DIR/shared"'
          EXTRACT_RELEASE_COMMAND='cd "$BASE_DIR/releases/$RELEASE_SHA" && tar -xzf release.tar.gz && rm release.tar.gz'
          LINK_CURRENT_COMMAND='ln -sfn "$BASE_DIR/releases/$RELEASE_SHA" "$BASE_DIR/current"'

          ssh "${SSH_OPTS[@]}" "$REMOTE" "export BASE_DIR='$BASE_DIR' RELEASE_SHA='$RELEASE_SHA'; $CREATE_RELEASE_COMMAND"
          ssh "${SSH_OPTS[@]}" "$REMOTE" "test -f '$BASE_DIR/shared/.env'"
          scp -i "$HOME/.ssh/test_server_key" -P "$TEST_SERVER_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$RUNNER_TEMP/release.tar.gz" "$REMOTE:$BASE_DIR/releases/$RELEASE_SHA/release.tar.gz"
          ssh "${SSH_OPTS[@]}" "$REMOTE" "export BASE_DIR='$BASE_DIR' RELEASE_SHA='$RELEASE_SHA'; $EXTRACT_RELEASE_COMMAND"
          ssh "${SSH_OPTS[@]}" "$REMOTE" "export BASE_DIR='$BASE_DIR' RELEASE_SHA='$RELEASE_SHA'; $LINK_CURRENT_COMMAND"

      - name: Migrate, restart, and smoke test
        run: |
          set -euo pipefail
          SSH_OPTS=(-i "$HOME/.ssh/test_server_key" -p "$TEST_SERVER_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          REMOTE="$TEST_SERVER_USER@$TEST_SERVER_HOST"
          POSTGRES_MAJOR_UPGRADE_COMMAND='cd "$BASE_DIR/current" && TARGET_POSTGRES_MAJOR=18 PRICE_MONITOR_ENV_FILE="$BASE_DIR/shared/.env" bash .github/scripts/postgres-major-upgrade.sh'
          MIGRATE_COMMAND='cd "$BASE_DIR/current" && PRICE_MONITOR_ENV_FILE="$BASE_DIR/shared/.env" docker compose --env-file "$BASE_DIR/shared/.env" run --rm api alembic upgrade head'
          COMPOSE_UP_COMMAND='cd "$BASE_DIR/current" && PRICE_MONITOR_ENV_FILE="$BASE_DIR/shared/.env" docker compose --env-file "$BASE_DIR/shared/.env" up -d --build'
          COMPOSE_PS_COMMAND='cd "$BASE_DIR/current" && PRICE_MONITOR_ENV_FILE="$BASE_DIR/shared/.env" docker compose --env-file "$BASE_DIR/shared/.env" ps'
          COMPOSE_IMAGES_COMMAND='cd "$BASE_DIR/current" && PRICE_MONITOR_ENV_FILE="$BASE_DIR/shared/.env" docker compose --env-file "$BASE_DIR/shared/.env" images'
          API_VERSION_COMMAND='cd "$BASE_DIR/current" && PRICE_MONITOR_ENV_FILE="$BASE_DIR/shared/.env" docker compose --env-file "$BASE_DIR/shared/.env" exec -T api python -c "import fastapi, platform; print(\"python=\" + platform.python_version()); print(\"fastapi=\" + fastapi.__version__)"'
          POSTGRES_VERSION_COMMAND='cd "$BASE_DIR/current" && PRICE_MONITOR_ENV_FILE="$BASE_DIR/shared/.env" docker compose --env-file "$BASE_DIR/shared/.env" exec -T postgres postgres --version'
          REDIS_VERSION_COMMAND='cd "$BASE_DIR/current" && PRICE_MONITOR_ENV_FILE="$BASE_DIR/shared/.env" docker compose --env-file "$BASE_DIR/shared/.env" exec -T redis redis-server --version'
          RABBITMQ_VERSION_COMMAND='cd "$BASE_DIR/current" && PRICE_MONITOR_ENV_FILE="$BASE_DIR/shared/.env" docker compose --env-file "$BASE_DIR/shared/.env" exec -T rabbitmq rabbitmq-diagnostics server_version'

          ssh "${SSH_OPTS[@]}" "$REMOTE" "export BASE_DIR='$BASE_DIR' RELEASE_SHA='$RELEASE_SHA'; $POSTGRES_MAJOR_UPGRADE_COMMAND"
          ssh "${SSH_OPTS[@]}" "$REMOTE" "export BASE_DIR='$BASE_DIR'; $MIGRATE_COMMAND"
          ssh "${SSH_OPTS[@]}" "$REMOTE" "export BASE_DIR='$BASE_DIR'; $COMPOSE_UP_COMMAND"
          ssh "${SSH_OPTS[@]}" "$REMOTE" "curl -fsS http://127.0.0.1:8000/health/live"
          ssh "${SSH_OPTS[@]}" "$REMOTE" "curl -fsS http://127.0.0.1:8000/health/ready"
          ssh "${SSH_OPTS[@]}" "$REMOTE" "export BASE_DIR='$BASE_DIR'; $COMPOSE_PS_COMMAND"
          ssh "${SSH_OPTS[@]}" "$REMOTE" "export BASE_DIR='$BASE_DIR'; $COMPOSE_IMAGES_COMMAND"
          ssh "${SSH_OPTS[@]}" "$REMOTE" "export BASE_DIR='$BASE_DIR'; $API_VERSION_COMMAND"
          ssh "${SSH_OPTS[@]}" "$REMOTE" "export BASE_DIR='$BASE_DIR'; $POSTGRES_VERSION_COMMAND"
          ssh "${SSH_OPTS[@]}" "$REMOTE" "export BASE_DIR='$BASE_DIR'; $REDIS_VERSION_COMMAND"
          ssh "${SSH_OPTS[@]}" "$REMOTE" "export BASE_DIR='$BASE_DIR'; $RABBITMQ_VERSION_COMMAND"
