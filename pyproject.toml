[build-system]
requires = ["setuptools==82.0.1", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "monitor-cashback-service"
version = "0.1.0"
description = "Reusable backend service infrastructure shell."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "alembic==1.18.5",
    "celery==5.6.3",
    "fastapi==0.138.2",
    "httpx==0.28.1",
    "playwright==1.61.0",
    "psycopg[binary]==3.3.4",
    "pydantic-settings==2.14.2",
    "redis==8.0.1",
    "sqlalchemy==2.0.51",
    "uvicorn[standard]==0.49.0",
]

[project.optional-dependencies]
dev = [
    "mypy==2.1.0",
    "pytest==9.1.1",
    "ruff==0.15.20",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM"]
ignore = [
    "S101",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S106"]

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
packages = ["price_monitor"]
strict = true
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*"]
ignore_missing_imports = true
