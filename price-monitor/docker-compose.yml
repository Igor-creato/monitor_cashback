services:
  backend-api:
    build:
      context: ./backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://cashback:cashback@mariadb:3306/cashback}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      CASHBACK_API_BASE_URL: ${CASHBACK_API_BASE_URL:-}
      CASHBACK_API_SITE_ID: ${CASHBACK_API_SITE_ID:-}
      CASHBACK_API_SECRET: ${CASHBACK_API_SECRET:-}
      OBJECT_STORAGE_ENABLED: ${OBJECT_STORAGE_ENABLED:-true}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-http://minio:9000}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-minioadmin}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-minioadmin123}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-product-images}
      OBJECT_STORAGE_PUBLIC_BASE_URL: ${OBJECT_STORAGE_PUBLIC_BASE_URL:-http://localhost:9000/product-images}
    ports:
      - "8000:8000"
    depends_on:
      mariadb:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  minio:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-product-images}
    entrypoint: >
      /bin/sh -c '
      until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER:-minioadmin}" "$${MINIO_ROOT_PASSWORD:-minioadmin123}"; do
        sleep 2;
      done;
      mc mb --ignore-existing local/$${OBJECT_STORAGE_BUCKET:-product-images};
      '

  mariadb:
    image: mariadb:11.8
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cashback}
      MYSQL_USER: ${MYSQL_USER:-cashback}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cashback}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql

  redis:
    image: redis:8.2-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  mariadb-data:
  minio-data:
