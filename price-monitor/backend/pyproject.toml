[build-system]
requires = ["setuptools>=82"]
build-backend = "setuptools.build_meta"

[project]
name = "price-monitor-backend"
version = "0.1.0"
description = "Price monitor FastAPI backend skeleton."
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18",
    "beautifulsoup4>=4.15",
    "celery>=5.6",
    "cryptography>=46",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "playwright>=1.57",
    "pymysql>=1.2",
    "pyyaml>=6",
    "sqlalchemy>=2.0.50",
    "uvicorn[standard]>=0.49.0",
    "pydantic-settings>=2.14.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.17",
]

[tool.pytest.ini_options]
testpaths = ["app/tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
